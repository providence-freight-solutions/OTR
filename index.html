<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100vh}
@font-face{font-display:swap}
body{background:#0a0a0b;color:#e8e0d0;font-family:'Barlow',sans-serif}
#app{position:relative;z-index:1;max-width:960px;margin:0 auto;padding:0 16px 100px}
.mono{font-family:'Barlow Condensed',sans-serif;font-weight:800;letter-spacing:.02em}
.label{font-family:'Barlow Condensed',sans-serif;font-size:10px;font-weight:700;
       letter-spacing:.15em;text-transform:uppercase;color:#555}
.card{background:#111112;border:1px solid #222;border-radius:6px;padding:18px 20px}
.card-sm{background:#111112;border:1px solid #222;border-radius:4px;padding:10px 14px}
.surface{background:#111112;border-radius:4px;padding:12px 16px;border:1px solid #1e1e1e}
button{cursor:pointer;font-family:'Barlow Condensed',sans-serif;font-weight:700;
       letter-spacing:.06em;text-transform:uppercase;border:none;border-radius:8px;
       padding:10px 20px;font-size:14px;transition:opacity .15s,transform .1s}
button:hover{opacity:.88}
button:active{transform:scale(.98)}
button:disabled{opacity:.4;cursor:not-allowed;transform:none}
.btn-primary{background:linear-gradient(135deg,#f5a623,#e8732a);color:#0d0f14}
.btn-danger{background:rgba(244,91,105,.13);color:#f45b69;border:1px solid rgba(244,91,105,.3)}
.btn-ghost{background:rgba(255,255,255,.05);color:#e8ecf4;border:1px solid #2a3040}
.btn-info{background:rgba(91,141,238,.13);color:#5b8dee;border:1px solid rgba(91,141,238,.3)}
.btn-success{background:rgba(62,207,142,.13);color:#3ecf8e;border:1px solid rgba(62,207,142,.3)}
input,select{background:#0f0f10;border:1px solid #2a2a2a;border-radius:4px;
             color:#e8e0d0;font-family:'Barlow',sans-serif;font-size:14px;
             padding:9px 12px;outline:none;width:100%;transition:border-color .2s}
input:focus,select:focus{border-color:#f5a623;box-shadow:0 0 0 2px rgba(245,166,35,.15)}
input::placeholder{color:#333}
select option{background:#0f0f10}
.badge{display:inline-flex;align-items:center;gap:5px;border-radius:6px;padding:3px 10px;
       font-size:12px;font-weight:600;font-family:'Barlow Condensed',sans-serif;letter-spacing:.04em}
.badge-amber{background:rgba(245,166,35,.12);color:#f5a623;border:1px solid rgba(245,166,35,.25)}
.badge-green{background:rgba(62,207,142,.12);color:#3ecf8e;border:1px solid rgba(62,207,142,.25)}
.badge-blue{background:rgba(91,141,238,.12);color:#5b8dee;border:1px solid rgba(91,141,238,.25)}
.badge-muted{background:rgba(255,255,255,.06);color:#7a8499;border:1px solid #2a3040}
.tab-bar{display:flex;gap:2px;background:#0a0a0b;border-bottom:2px solid #1a1a1a;padding:0;margin-bottom:20px}
.tab{flex:1;padding:10px 14px;border-radius:0;font-family:'Barlow Condensed',sans-serif;
     font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
     color:#555;background:none;border:none;border-bottom:2px solid transparent;
     margin-bottom:-2px;cursor:pointer;transition:all .15s}
.tab.active{color:#f5a623;border-bottom-color:#f5a623;background:rgba(245,166,35,.04)}
.divider{height:1px;background:#2a3040;margin:16px 0}
.stop-card{border:1px solid #1a1a1a;border-radius:4px;overflow:hidden;margin-bottom:8px;background:#0f0f10;transition:opacity .3s}
.stop-card.done-stop{opacity:.35}
.stop-header{padding:12px 16px;display:flex;align-items:flex-start;justify-content:space-between;
             gap:10px;cursor:pointer;border-left:3px solid transparent;transition:background .15s;user-select:none}
.stop-header:hover{background:rgba(245,166,35,.03)}
.stop-body{display:none;padding:0 16px 14px;border-top:1px solid #1a1a1a}
.stop-body.open{display:block}
.tbl{width:100%;border-collapse:collapse;font-size:12px;margin-top:12px}
.tbl th{font-family:'Barlow Condensed',sans-serif;font-size:10px;font-weight:700;
        letter-spacing:.12em;text-transform:uppercase;color:#7a8499;padding:8px 10px;
        text-align:left;background:#1e2330;border-bottom:1px solid #2a3040;white-space:nowrap}
.tbl td{padding:8px 10px;border-bottom:1px solid rgba(42,48,64,.5);color:#e8ecf4;vertical-align:top;line-height:1.35}
.tbl tr:last-child td{border-bottom:none}
.tbl tbody tr:hover{background:rgba(255,255,255,.015)}
.scroll-area{max-height:340px;overflow-y:auto;padding-right:4px}
.scroll-area::-webkit-scrollbar{width:4px}
.scroll-area::-webkit-scrollbar-track{background:#1e2330}
.scroll-area::-webkit-scrollbar-thumb{background:#2a3040;border-radius:4px}
.check-item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;
            cursor:pointer;transition:background .12s;border-left:3px solid transparent}
.check-item:hover{background:#1e2330}
.check-item input[type=checkbox]{width:16px;height:16px;accent-color:#f5a623;cursor:pointer;flex-shrink:0}
.spinner{width:20px;height:20px;border:2px solid #2a3040;border-top-color:#f5a623;
         border-radius:50%;animation:spin .7s linear infinite;display:inline-block;flex-shrink:0}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-screen{display:flex;align-items:center;justify-content:center;
                min-height:60vh;flex-direction:column;gap:14px;color:#7a8499;font-size:14px}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
       background:#1e2330;border:1px solid #3ecf8e;color:#3ecf8e;border-radius:10px;
       padding:12px 24px;font-weight:600;font-size:14px;z-index:999;animation:fadeUp .3s ease;
       white-space:nowrap;font-family:'Barlow Condensed',sans-serif;letter-spacing:.04em}
.toast.err{border-color:#f45b69;color:#f45b69}
@keyframes fadeUp{from{opacity:0;transform:translateX(-50%) translateY(10px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
.page-fade{animation:pf .25s ease}
@keyframes pf{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.route-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;display:inline-block}
.done-badge{display:inline-flex;align-items:center;gap:4px;background:rgba(62,207,142,.15);
            color:#3ecf8e;border:1px solid rgba(62,207,142,.3);border-radius:3px;
            padding:1px 7px;font-size:10px;font-weight:700;font-family:'Barlow Condensed',sans-serif;
            letter-spacing:.06em;text-transform:uppercase}
.manager-section{background:#0f0f10;border:1px solid #1a1a1a;border-radius:4px;margin-bottom:12px}
.manager-header{padding:10px 14px;display:flex;align-items:center;justify-content:space-between;
                cursor:pointer;user-select:none}
.manager-header:hover{background:rgba(245,166,35,.03)}
.badge-purple{background:rgba(167,139,250,.12);color:#a78bfa;border:1px solid rgba(167,139,250,.25)}
.pickup-search{position:relative}
.pickup-dropdown{position:absolute;top:100%;left:0;right:0;background:#1e2330;border:1.5px solid #f5a623;border-top:none;border-radius:0 0 8px 8px;max-height:220px;overflow-y:auto;z-index:50}
.pickup-option{padding:9px 14px;cursor:pointer;font-size:13px;color:#e8ecf4;border-bottom:0.5px solid #2a3040}
.pickup-option:last-child{border-bottom:none}
.pickup-option:hover{background:#2a3040}
.pickup-option .opt-addr{font-size:11px;color:#7a8499;margin-top:2px}
.pickup-row{display:flex;align-items:center;gap:10px;padding:8px 12px;background:#1e2330;border-radius:8px;margin-bottom:6px;border:0.5px solid #2a3040}
.pickup-num{width:22px;height:22px;border-radius:50%;background:#f5a623;color:#0d0f14;font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
@media(max-width:600px){
  #app{padding:0 12px 80px}
  .card{padding:16px}
  .stop-header{flex-wrap:wrap}
  .tbl th:nth-child(3),.tbl td:nth-child(3){display:none}
}

<script>
// Set favicon dynamically using the embedded logo
(function(){
  var canvas = document.createElement('canvas');
  canvas.width = 64; canvas.height = 64;
  var ctx = canvas.getContext('2d');
  var img = new Image();
  img.onload = function(){
    ctx.drawImage(img, 0, 0, 64, 64);
    var link = document.querySelector("link[rel~='icon']") || document.createElement('link');
    link.type = 'image/png';
    link.rel = 'shortcut icon';
    link.href = canvas.toDataURL();
    document.head.appendChild(link);
  };
  // Will be set after LOGO_B64 is defined
  window.__setFavicon = function(src){ img.src = src; };
})();
</script>

// ── Hash ──────────────────────────────────────────────────
async function hashPassword(pw) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(pw));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}

// ── API (GET only — avoids CORS issues with Apps Script) ──
async function api(action, params={}) {
  const qs  = new URLSearchParams({action, ...params}).toString();
  const res = await fetch(APPS_SCRIPT_URL + "?" + qs, {method:"GET", redirect:"follow"});
  const data = await res.json();
  if (data.error) throw new Error(data.error);
  return data;
}

// ── Helpers ───────────────────────────────────────────────
function fmtDate(raw) {
  if (!raw) return '';
  const months=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const s = String(raw).trim();

  // Format 1: "5/11/2026 14:30:00" — from CSV export
  const m1 = s.match(/^(\d+)\/(\d+)\/(\d+)\s+(\d+):(\d+)/);
  if (m1) {
    const mo=parseInt(m1[1])-1, day=parseInt(m1[2]), yr=parseInt(m1[3]);
    const hr=parseInt(m1[4]), min=parseInt(m1[5]);
    const t = (hr===0&&min===0) ? '' : ` ${hr%12||12}:${String(min).padStart(2,'0')} ${hr<12?'AM':'PM'}`;
    return `${months[mo]} ${day}, ${yr}${t}`;
  }

  // Format 2: "Mon May 18 2026 14:00:00 GMT-0400 ..." — from Google Sheets live data
  const m2 = s.match(/[A-Za-z]+\s+([A-Za-z]+)\s+(\d+)\s+(\d+)\s+(\d+):(\d+)/);
  if (m2) {
    const moName=m2[1], day=parseInt(m2[2]), yr=parseInt(m2[3]);
    const hr=parseInt(m2[4]), min=parseInt(m2[5]);
    const moIdx = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec']
                  .findIndex(x=>moName.startsWith(x));
    const moStr = moIdx>=0 ? months[moIdx] : moName.slice(0,3);
    const t = (hr===0&&min===0) ? '' : ` ${hr%12||12}:${String(min).padStart(2,'0')} ${hr<12?'AM':'PM'}`;
    return `${moStr} ${day}, ${yr}${t}`;
  }

  return s;
}

function groupStops(shipments) {
  const map = new Map();
  (shipments||[]).forEach(s => {
    if (!map.has(s.consignee))
      map.set(s.consignee, {
        name:        s.consignee,
        del_city:    s.del_city,
        del_state:   s.del_state,
        sched_del:   s.sched_del,
        app_address: s.app_address || '',
        phone:       s.phone || '',
        appt:        s.appt || false,
        orders:      []
      });
    const stop = map.get(s.consignee);
    if (s.appt) stop.appt = true; // any order with appt flags the whole stop
    stop.orders.push(s);
  });
  return Array.from(map.values());
}

const PW_ADDRESS = '2 Laurel Dr., Flanders NJ 07836';
function pwAddr(p) {
  if (p && p.name && p.name.toUpperCase().includes('PROVIDENCE WAREHOUSE')) return PW_ADDRESS;
  return (p && p.address) || '';
}

function esc(str) {
  return String(str||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

  view:'loading', session:null, trucks:[], users:{},
  adminTab:'loads', selectedLoad:null, expandedUser:null, toast:null,
  addressBook:[],    // loaded once from Apps Script
  expandedStops:{},  // {loadNum: Set of stop indices that are open}
  archiveResult:null,    // truck object from archive search
  archiveError:null,     // error string
  archiveQuery:'',       // last searched load number
  archiveSearching:false,// true while waiting for response
  showGPSMap:false,      // show GPS map modal
  gpsLocations:[],       // [{username, lat, lng, timestamp}]
  gpsLoading:false,      // loading GPS data
  carrierLocation:null,  // current carrier's own location
  loadingMsg:null        // message shown on the loading screen
};

function setState(patch) {
  state={...state,...patch};
  // Persist session so refresh doesn't log out
  if (state.session) {
    try { sessionStorage.setItem('pfs_session', JSON.stringify(state.session)); } catch(e){}
  } else {
    try { sessionStorage.removeItem('pfs_session'); } catch(e){}
  }
  render();
}

function showToast(msg, type='ok') {
  setState({toast:{msg,type}});
  setTimeout(()=>setState({toast:null}), 2800);
}

function renderLoadCard(truck, isAdmin=false) {
  // Lazy-load address book for pickup search if not yet loaded
  if (isAdmin && (!state.addressBook || state.addressBook.length === 0)) {
    api('getAddressBook').then(r => {
      if (r.locations && r.locations.length) {
        state.addressBook = r.locations; // update without re-render
      }
    }).catch(()=>{});
  }

  // Initialize default pickup (Providence Warehouse) if none saved and admin is viewing
  if (isAdmin && !(truck.pickups && truck.pickups.length>0)) {
    const pw = state.addressBook.find(l=>l.name.toUpperCase().includes('PROVIDENCE WAREHOUSE'));
    truck = {...truck, pickups:
      [{name:'PROVIDENCE WAREHOUSE', address:'2 Laurel Dr., Flanders NJ 07836', datetime:'', notes:''}]
    };
    // Sync back to state silently
    state.trucks = state.trucks.map(t=>t.load_number===truck.load_number?truck:t);
  }
  const allStops = groupStops(truck.shipments);
  // active_stops is an array of stop names admin has enabled; empty = all active
  const activeNames = truck.active_stops && truck.active_stops.length > 0 ? truck.active_stops : null;
  // Admin sees ALL stops with checkboxes; driver sees only active stops (renumbered)
  const stops = isAdmin ? allStops : (activeNames ? allStops.filter(st=>activeNames.includes(st.name)) : allStops);
  const totalW = (truck.shipments||[]).reduce((a,s)=>a+s.weight,0);
  const totalP = (truck.shipments||[]).reduce((a,s)=>a+s.pallets,0);
  const hasLocal = truck.ca_local_del && truck.ca_local_del !== '$0.00';

  // Route bar: admin shows all (dimmed if inactive), driver shows only active
  const routeStops = isAdmin ? allStops : stops;
  const routeBar = routeStops.map((st,i)=>{
    const isAct = !activeNames || activeNames.includes(st.name);
    const col   = isAct ? STOP_COLORS[i%STOP_COLORS.length] : '#3a4050';
    return `
    <span class="route-dot" style="background:${col};opacity:${isAct?1:0.4}"></span>
    <span style="font-size:12px;font-family:'Barlow Condensed',sans-serif;font-weight:700;color:${col};white-space:nowrap;opacity:${isAct?1:0.4}">${esc(st.name)}</span>
    ${i<routeStops.length-1?'<span style="color:#2a3040;font-size:14px">›</span>':''}`;
  }).join('');

  // Track sequential display number for active stops (driver sees 1,2 not 1,4)
  let driverStopNum = 0;
  const stopCards = allStops.map((st,i)=>{
    const isActive = !activeNames || activeNames.includes(st.name);
    const color = isActive ? STOP_COLORS[i%STOP_COLORS.length] : '#3a4050';
    const sw = st.orders.reduce((a,s)=>a+s.weight,0);
    const sp = st.orders.reduce((a,s)=>a+s.pallets,0);
    // Driver only sees active stops — skip rendering inactive
    if (!isAdmin && !isActive) return '';
    const rows = st.orders.map(s=>`
      <tr>
        <td>
          <div style="font-size:11px;color:#7a8499;font-family:'Barlow Condensed',sans-serif">${esc(s.po_num)}</div>
          ${s.ship_ref?`<div style="font-size:11px;margin-top:2px;color:${s.ship_ref.toUpperCase().includes('FROZEN')?'#a78bfa':s.ship_ref.toUpperCase().includes('COLD')?'#5b8dee':'#7a8499'}">${esc(s.ship_ref)}</div>`:''}
          ${s.notes?`<div style="margin-top:4px;font-size:10px;background:rgba(245,166,35,.1);border:1px solid rgba(245,166,35,.2);border-radius:4px;padding:2px 6px;color:#f5a623;display:inline-block">📌 ${esc(s.notes)}</div>`:''}
        </td>
        <td style="font-size:12px">${esc(s.shipper)}<br><span style="font-size:11px;color:#7a8499">${esc(s.or_city)}, ${esc(s.or_state)}</span></td>
        <td style="font-size:11px;color:#7a8499">${esc(s.pickup_num)||'—'}</td>
        <td style="font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:14px;text-align:right">${s.weight>0?s.weight.toLocaleString():'—'}</td>
        <td style="font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:14px;text-align:right">${s.pallets>0?s.pallets:'—'}</td>
      </tr>`).join('');
    // Admin checkbox for stop visibility
    const adminCheck = isAdmin ? `
      <div style="display:flex;align-items:center;gap:8px;padding:10px 18px;background:rgba(0,0,0,.2);border-bottom:1px solid #2a3040">
        <input type="checkbox" id="stop-chk-${esc(truck.load_number)}-${i}"
               class="stop-vis-${esc(truck.load_number)}"
               value="${esc(st.name)}"
               ${isActive?'checked':''}
               style="width:16px;height:16px;accent-color:#f5a623;cursor:pointer">
        <label for="stop-chk-${esc(truck.load_number)}-${i}" style="font-size:12px;color:#7a8499;cursor:pointer;font-family:'Barlow Condensed',sans-serif;font-weight:700;letter-spacing:.08em;text-transform:uppercase">
          ${isActive ? 'Visible to driver' : 'Hidden from driver'}

function getRegion(truck) {
  const LOCAL      = new Set(['NY','NJ','CT','PA','MA','RI','VT','NH','ME','DE','MD','DC']);
  const CALIFORNIA = new Set(['CA','NV','AZ','OR','WA']);
  const SOUTHEAST  = new Set(['FL','GA','SC','NC','VA','TN','AL','MS','LA','AR','KY','WV']);
  const MIDWEST    = new Set(['IL','IN','OH','MI','WI','MN','IA','MO','ND','SD','NE','KS']);
  const score = {Local:0,California:0,Southeast:0,Midwest:0,Other:0};
  (truck.shipments||[]).forEach(s=>{
    const st=(s.del_state||'').trim().toUpperCase();
    if(LOCAL.has(st))           score.Local++;
    else if(CALIFORNIA.has(st)) score.California++;
    else if(SOUTHEAST.has(st))  score.Southeast++;
    else if(MIDWEST.has(st))    score.Midwest++;
    else                        score.Other++;
  });
  return Object.entries(score).sort((a,b)=>b[1]-a[1])[0][0];
}

            <span style="font-size:11px;color:#e8ecf4;font-weight:600">${esc(t.carrier)}</span>
            <span style="font-size:11px;color:#7a8499">· ${stops.length} stop${stops.length!==1?'s':''} · ${(t.shipments||[]).length} orders</span>
            <span style="margin-left:auto;font-size:12px;color:${checked?'#3ecf8e':'#7a8499'};font-family:'Barlow Condensed',sans-serif;font-weight:700">${esc(t.carrier_pay)}</span>
          </div>
          <div style="font-size:11px;color:#7a8499;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">
            ${stops.slice(0,3).map(s=>esc(s.name)).join(' › ')}${stops.length>3?` +${stops.length-3} more`:''}
          </div>
        </div>
      </label>`;
    }).join('');
    const assignedBadges = (u.loads||[]).length>0 && !isExp
      ? `<div style="margin-top:10px;display:flex;gap:6px;flex-wrap:wrap">${(u.loads||[]).map(ln=>`<span class="badge badge-amber">#${esc(ln)}</span>`).join('')}</div>` : '';
    return `
    <div class="card" style="margin-bottom:14px">
      <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap">
        <div style="display:flex;align-items:center;gap:12px">
          <div style="width:36px;height:36px;border-radius:9px;background:rgba(91,141,238,.15);border:1px solid rgba(91,141,238,.3);display:flex;align-items:center;justify-content:center;font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:16px;color:#5b8dee">${esc(u.name.charAt(0).toUpperCase())}</div>
          <div>
            <div style="font-weight:600;font-size:15px">${esc(u.name)}</div>
            <div style="font-size:12px;color:#7a8499">@${esc(uid)} · ${(u.loads||[]).length} load${(u.loads||[]).length!==1?'s':''} assigned</div>
          </div>
        </div>
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          <button class="btn-info" style="font-size:12px;padding:6px 14px" onclick="setState({expandedUser:'${uid}'==='${state.expandedUser}'?null:'${uid}'})">${isExp?'Hide loads':'Assign Loads'}</button>
          <button class="${u.is_manager?'btn-success':'btn-ghost'}" style="font-size:12px;padding:6px 14px"
                  onclick="setManagerStatus('${uid}',${!u.is_manager})">
            ${u.is_manager?'★ Manager':'☆ Make Manager'}</button>
          <button class="btn-danger" style="font-size:12px;padding:6px 14px" onclick="handleDeleteUser('${uid}')">Remove</button>
        </div>
      </div>
      ${isExp?`<div style="margin-top:14px;border-top:1px solid #1a1a1a;padding-top:14px">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">
          <div class="label">Assign loads to ${esc(u.name)}</div>
          <button class="btn-success" style="font-size:12px;padding:7px 18px" onclick="saveLoads('${uid}')">✓ Save</button>
        </div>
        <div class="scroll-area">${checkList}</div>
        <div style="margin-top:12px;display:flex;justify-content:flex-end">
          <button class="btn-success" style="font-size:12px;padding:7px 18px" onclick="saveLoads('${uid}')">✓ Save Assignments</button>
        </div>
        ${u.is_manager?`
        <div style="margin-top:16px;border-top:1px solid #1a1a1a;padding-top:12px">
          <div class="label" style="color:#a78bfa;margin-bottom:10px">★ Team — check who ${esc(u.name)} manages</div>
          <div style="display:flex;flex-wrap:wrap;gap:8px" id="team-${uid}">
            ${Object.entries(state.users).filter(([tid])=>tid!==uid).map(([tid,tu],i)=>{
              const isMember=(u.manages||[]).map(m=>m.toLowerCase()).includes(tid.toLowerCase());
              return '<label style="display:flex;align-items:center;gap:6px;cursor:pointer;'+
                'background:'+(isMember?'rgba(167,139,250,.12)':'#0f0f10')+';'+
                'border:1px solid '+(isMember?'rgba(167,139,250,.3)':'#222')+';'+
                'border-radius:4px;padding:6px 12px">'+
                '<input type="checkbox" '+(isMember?'checked':'')+
                ' onchange="updateManagesByIndex(\'' + uid + '\','+i+',this.checked)"'+
                ' style="width:14px;height:14px;accent-color:#a78bfa;cursor:pointer">'+
                '<span style="font-size:13px;font-weight:700;color:#a78bfa">'+esc(tu.name)+'</span>'+
                '</label>';
            }).join('')}
          </div>
          <div style="font-size:11px;color:#555;margin-top:8px">Checked members appear in ${esc(u.name)}'s team view when they log in as carrier.</div>
        </div>`:''}'
      </div>`:''}'
    </div>
  `;
  }).join('');

  if (!driverCards.trim()) return `<div class="surface" style="text-align:center;padding:40px;color:#7a8499">No carriers found.</div>`;
  return `
  <div>
    <div style="margin-bottom:16px">
      <button class="btn-success" style="font-size:12px;padding:8px 18px" onclick="setState({expandedUser:'__add__'})">+ Add Carrier</button>
    </div>

}


// ── Render ────────────────────────────────────────────────────
function render() {
  const app = document.getElementById('app');
  if (!app) return;
  let html = renderHeader();
  switch(state.view) {
    case 'loading':
      html += `<div style="text-align:center;padding:80px 20px">
        <img src="${LOGO_B64}" style="width:56px;height:56px;object-fit:contain;opacity:.6;margin:0 auto 20px;display:block">
        <div class="spinner" style="margin:0 auto 16px"></div>
        <div style="font-family:'Barlow Condensed',sans-serif;font-size:15px;letter-spacing:.08em;text-transform:uppercase;color:#f5a623;font-weight:700;margin-bottom:6px">
          ${state.loadingMsg || 'Loading…'}
        </div>
        <div style="font-size:12px;color:#555">Please wait</div>
      </div>`;
      break;
    case 'login':
      html += renderLogin();
      break;
    case 'admin':
      if (state.selectedLoad) {
        const truck = state.trucks.find(t=>t.load_number===state.selectedLoad) || state.archiveResult;
        html += `<div style="padding:16px 0">
          <div style="display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap">
            <button class="btn-ghost" style="font-size:12px" onclick="setState({selectedLoad:null})">← Back to all loads</button>
            ${truck ? `<button class="btn-info" style="font-size:12px;padding:7px 16px" onclick="downloadPDF('${truck.load_number}', true)">⬇ Download PDF</button>` : ''}
          </div>
          ${truck?renderLoadCard(truck, true):'<div class="surface" style="color:#7a8499;padding:20px">Load not found.</div>'}`;
        if (!state.addressBook || state.addressBook.length === 0) {
          api('getAddressBook').then(r => { if(r.locations) state.addressBook = r.locations; }).catch(()=>{});
        }
        html += `</div>`;
      } else {
        html += `<div style="padding:16px 0">
          <div class="tab-bar">
            <button class="tab ${state.adminTab==='loads'?'active':''}" onclick="setState({adminTab:'loads'})">All Loads</button>
            <button class="tab ${state.adminTab==='drivers'?'active':''}" onclick="setState({adminTab:'drivers'})">Carriers &amp; Assignments</button>
            <button class="tab ${state.adminTab==='archive'?'active':''}" onclick="setState({adminTab:'archive',archiveResult:null,archiveError:null})">🗂 Archive</button>
          </div>
          ${state.adminTab==='loads'?renderAdminLoads():state.adminTab==='drivers'?renderAdminDrivers():renderArchive()}
        </div>`;
      }
      break;
    case 'driver': {
      const myLoads = Object.values(state.users).find(u=>u.name===state.session?.id||u.name===state.session?.name);
      const assignedNums = myLoads ? (myLoads.loads||[]) : [];
      if (state.selectedLoad) {
        const truck = state.trucks.find(t=>t.load_number===state.selectedLoad);
        html += `<div style="padding:16px 0">
          <div style="display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap">
            <button class="btn-ghost" style="font-size:12px" onclick="setState({selectedLoad:null})">← My Loads</button>
            ${truck ? `
            <button class="btn-info" style="font-size:12px;padding:7px 16px" onclick="downloadPDF('${truck.load_number}', false)">⬇ Driver Dispatch Download</button>
            <button class="btn-success" style="font-size:12px;padding:7px 16px" onclick="downloadPDF('${truck.load_number}', true)">⬇ Download Rate Confirmation</button>` : ''}
          </div>
          ${truck?renderLoadCard(truck):'<div class="surface" style="color:#7a8499;padding:20px">Load not found.</div>'}
        </div>`;
      } else {
        const myTrucks = assignedNums.map(ln=>state.trucks.find(t=>t.load_number===ln)).filter(Boolean);
        const cards = myTrucks.map(t=>{
          const allStopsForCard = groupStops(t.shipments);
          const activeNamesForCard = t.active_stops && t.active_stops.length > 0 ? t.active_stops : null;
          const stops = activeNamesForCard ? allStopsForCard.filter(s=>activeNamesForCard.includes(s.name)) : allStopsForCard;
          const activeShipments = activeNamesForCard
            ? (t.shipments||[]).filter(s=>activeNamesForCard.includes(s.consignee))
            : (t.shipments||[]);
          const tw = activeShipments.reduce((a,s)=>a+s.weight,0);
          const activeOrders = activeShipments.length;
          const doneCount = stops.filter(s=>t.stop_status&&t.stop_status[s.name]&&t.stop_status[s.name].done).length;
          return `
          <div class="card" style="cursor:pointer;border-left:3px solid #f5a623;margin-bottom:12px" onclick="setState({selectedLoad:'${esc(t.load_number)}'})">
            <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap">
              <div>
                <div class="label" style="margin-bottom:4px">Load Number</div>
                <div class="mono" style="font-size:32px;color:#f5a623;line-height:1">${esc(t.load_number)}</div>
                <div style="font-size:12px;color:#7a8499;margin-top:4px">${esc(t.carrier)}</div>
              </div>
              <div style="display:flex;gap:20px;text-align:center">
                <div><div class="mono" style="font-size:22px">${stops.length}</div><div class="label">Stops</div></div>
                <div><div class="mono" style="font-size:22px">${activeOrders}</div><div class="label">Orders</div></div>
                <div><div class="mono" style="font-size:22px">${tw.toLocaleString()}</div><div class="label">Lbs</div></div>
                <div><div class="mono" style="font-size:22px;color:${doneCount===stops.length&&stops.length>0?'#3ecf8e':'#e8e0d0'}">${doneCount}/${stops.length}</div><div class="label">Done</div></div>
              </div>
            </div>
          </div>`;
        }).join('');

        html += `<div style="padding:16px 0">`;
        if (!myTrucks.length) {
          html += `<div class="surface" style="text-align:center;padding:40px;color:#7a8499">No loads assigned yet.</div>`;
        } else {
          html += cards;
        }

        // Manager view: show team members' loads and stop status below own loads
        const mgr = state.users[state.session?.id] || state.users[state.session?.name];
        if (mgr && mgr.is_manager && (mgr.manages||[]).length > 0) {
          html += `
          <div style="margin-top:24px;border-top:2px solid #1a1a1a;padding-top:20px">
            <div class="label" style="margin-bottom:14px;color:#a78bfa">★ Your Team</div>
            ${mgr.manages.map(tid => {
              const tm = state.users[tid];
              if (!tm) return '';
              const tmLoads = (tm.loads||[]).map(ln=>state.trucks.find(t=>t.load_number===ln)).filter(Boolean);
              return '<div style="background:#0f0f10;border:1px solid #1a1a1a;border-radius:4px;margin-bottom:12px;overflow:hidden">' +
                '<div style="padding:10px 14px;background:#111;border-bottom:1px solid #1a1a1a;display:flex;align-items:center;gap:10px">' +
                  '<div style="width:28px;height:28px;border-radius:50%;background:rgba(167,139,250,.15);border:1px solid rgba(167,139,250,.3);display:flex;align-items:center;justify-content:center;font-family:Barlow Condensed,sans-serif;font-weight:800;font-size:14px;color:#a78bfa">' + esc(tm.name.charAt(0).toUpperCase()) + '</div>' +
                  '<div style="font-weight:600;font-size:14px;color:#a78bfa">' + esc(tm.name) + '</div>' +
                  '<div style="font-size:11px;color:#555;margin-left:4px">' + tmLoads.length + ' load' + (tmLoads.length!==1?'s':'') + '</div>' +
                '</div>' +
                (tmLoads.length === 0 ? '<div style="padding:14px;font-size:12px;color:#555">No loads assigned</div>' :
                tmLoads.map(t => {
                  const allS  = groupStops(t.shipments);
                  const actN  = t.active_stops&&t.active_stops.length>0?t.active_stops:null;
                  const stps  = actN?allS.filter(s=>actN.includes(s.name)):allS;
                  const done  = stps.filter(s=>t.stop_status&&t.stop_status[s.name]&&t.stop_status[s.name].done).length;
                  return '<div style="padding:10px 14px;border-bottom:1px solid #1a1a1a">' +
                    '<div style="display:flex;align-items:center;gap:10px;margin-bottom:6px">' +
                      '<span class="mono" style="font-size:18px;color:#f5a623">#' + esc(t.load_number) + '</span>' +
                      '<span style="font-size:11px;color:#555">' + esc(t.carrier) + '</span>' +
                      '<span style="margin-left:auto;font-size:11px;color:' + (done===stps.length&&stps.length>0?'#3ecf8e':'#555') + '">' + done + '/' + stps.length + ' done</span>' +
                    '</div>' +
                    stps.map(s => {
                      const st   = t.stop_status&&t.stop_status[s.name];
                      const isDn = st&&st.done;
                      return '<div style="display:flex;align-items:center;gap:8px;padding:4px 0;opacity:' + (isDn?0.4:1) + '">' +
                        '<span style="font-size:10px;color:' + (isDn?'#3ecf8e':'#555') + '">' + (isDn?'✓':'○') + '</span>' +
                        '<span style="font-size:12px;color:' + (isDn?'#555':'#e8e0d0') + '">' + esc(s.name) + '</span>' +
                        (isDn&&st.timestamp?'<span style="font-size:10px;color:#444;margin-left:auto">' + esc(st.timestamp) + '</span>':'') +
                      '</div>';
                    }).join('') +
                  '</div>';
                }).join('')) +
              '</div>';
            }).join('')}
          </div>`;
        }
        html += `</div>`;
      }
      break;
    }
  }

  // GPS Map Modal
  if (state.showGPSMap) {
    const locs  = state.gpsLocations;
    const users = state.users;
    html += `
    <div style="position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px">
      <div style="background:#0f0f10;border:1px solid #222;border-radius:6px;width:100%;max-width:700px;max-height:90vh;overflow:auto">
        <div style="padding:16px 20px;border-bottom:1px solid #1a1a1a;display:flex;align-items:center;justify-content:space-between">
          <div style="font-family:'Barlow Condensed',sans-serif;font-size:16px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:#f5a623">🗺 Carrier Locations</div>
          <button class="btn-ghost" style="font-size:12px;padding:5px 12px" onclick="setState({showGPSMap:false})">✕ Close</button>
        </div>
        <div style="padding:16px 20px">
          ${state.gpsLoading ? '<div style="text-align:center;padding:40px;color:#555"><div class="spinner" style="margin:0 auto 12px"></div>Loading locations…</div>' :
          locs.length === 0 ? '<div style="text-align:center;padding:40px;color:#555">No carrier locations available.</div>' :
          locs.map(loc => {
            const u = users[loc.username] || {};
            const loads = (u.loads||[]).join(', ') || '—';
            return `<div style="display:flex;align-items:center;gap:14px;padding:12px 0;border-bottom:1px solid #1a1a1a">
              <div style="width:36px;height:36px;border-radius:50%;background:rgba(91,141,238,.15);border:1px solid rgba(91,141,238,.3);display:flex;align-items:center;justify-content:center;font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:16px;color:#5b8dee;flex-shrink:0">${esc(loc.username.charAt(0).toUpperCase())}</div>
              <div style="flex:1">
                <div style="font-weight:600;font-size:14px">${esc(loc.username)}</div>
                <div style="font-size:11px;color:#555;margin-top:2px">📍 ${loc.lat.toFixed(4)}, ${loc.lng.toFixed(4)} · ${esc(loc.timestamp)}</div>
                <div style="font-size:11px;color:#f5a623;margin-top:1px">Loads: ${esc(loads)}</div>
              </div>
              <a href="https://www.google.com/maps?q=${loc.lat},${loc.lng}" target="_blank"
                 style="background:rgba(91,141,238,.12);border:1px solid rgba(91,141,238,.3);color:#5b8dee;border-radius:4px;padding:5px 12px;font-size:11px;text-decoration:none;font-family:'Barlow Condensed',sans-serif;font-weight:700;letter-spacing:.06em;text-transform:uppercase">Open Map ↗</a>
            </div>`;
          }).join('')}
        </div>
      </div>
    </div>`;
  }

  app.innerHTML = html;
}

  <div style="max-width:380px;margin:60px auto;padding:0 16px">
    <div class="card" style="text-align:center">
      <img src="${LOGO_B64}" style="width:72px;height:72px;object-fit:contain;margin:0 auto 16px;display:block">
      <div style="font-family:'Barlow Condensed',sans-serif;font-size:22px;font-weight:900;text-transform:uppercase;letter-spacing:.08em;color:#f5a623;margin-bottom:4px">Providence</div>
      <div style="font-size:12px;color:#555;margin-bottom:28px;font-family:'Barlow Condensed',sans-serif;letter-spacing:.12em;text-transform:uppercase">Carrier Portal</div>
      <input id="li-user" type="text" placeholder="Username" style="margin-bottom:12px" autocapitalize="none">

             onkeydown="if(event.key==='Enter')handleLogin()">

// ── Add Carrier form ──────────────────────────────────────
function renderAddUser() {
  return `
  <div class="surface" style="margin-bottom:16px">
    <div class="label" style="margin-bottom:12px">New Carrier</div>
    <div style="display:flex;gap:10px;flex-wrap:wrap">
      <input id="new-username" type="text" placeholder="Username" style="flex:1;min-width:140px;margin:0">
      <input id="new-password" type="password" placeholder="Password" style="flex:1;min-width:140px;margin:0">
      <button class="btn-success" style="font-size:12px;padding:8px 18px;white-space:nowrap" onclick="handleAddUser()">Add</button>
      <button class="btn-ghost" style="font-size:12px;padding:8px 14px" onclick="setState({expandedUser:null})">Cancel</button>
    </div>
  </div>`;
}

// ── Event handlers ─────────────────────────────────────────
function toggleStop(i, loadNum) {
  const body = document.getElementById('stop-body-'+i);
  const chev = document.getElementById('chev-'+i);
  if (!body) return;
  const open = body.classList.toggle('open');
  if (chev) chev.style.transform = open?'rotate(180deg)':'none';
  if (loadNum) {
    if (!state.expandedStops[loadNum]) state.expandedStops[loadNum] = new Set();
    if (open) state.expandedStops[loadNum].add(i);
    else       state.expandedStops[loadNum].delete(i);
  }
}

async function handleLogin() {
  const username = (document.getElementById('li-user')?.value||'').trim().toLowerCase();
  const password =  document.getElementById('li-pass')?.value||'';
  if (!username||!password) return showToast('Enter username and password','err');

  if (username==='admin') {
    if (password!==ADMIN_PASSWORD) return showToast('Incorrect admin password','err');
    // Show loading state immediately
    setState({view:'loading', loadingMsg:'Welcome back, Admin. Loading your dashboard…'});
    await refreshAll();
    setState({session:{role:'admin',name:'Admin',id:'admin'},view:'admin', loadingMsg:null});
    return;
  }

  const userKey = Object.keys(state.users).find(k => k.toLowerCase() === username);
  const u = userKey ? state.users[userKey] : null;
  if (!u) return showToast('Username not found','err');
  const hash = await hashPassword(password);
  if (hash !== u.password_hash) return showToast('Incorrect password','err');

  // Credentials accepted — show loading immediately before the API call
  setState({view:'loading', loadingMsg:`Welcome, ${u.name}. Loading your loads…`});
  await refreshAll();
  setState({session:{role:'driver',name:u.name,id:userKey},view:'driver', loadingMsg:null});
  startGPS();
}

function handleLogout() {
  stopGPS();
  try { sessionStorage.removeItem('pfs_session'); } catch(e){}
  setState({session:null,view:'login',selectedLoad:null,expandedUser:null});
}

async function handleAddUser() {
  const username = (document.getElementById('new-username')?.value||'').trim();
  const password = document.getElementById('new-password')?.value||'';
  if (!username||!password) return showToast('Enter username and password','err');
  const hash = await hashPassword(password);
  const res = await api('saveUser',{username,password_hash:hash});
  if (res.error) return showToast(res.error,'err');
  showToast('Carrier added');
  const usersRes = await api('getUsers');
  setState({users:usersRes.users||{},expandedUser:null});
}

async function handleDeleteUser(uid) {
  if (!confirm(`Remove carrier "${uid}"?`)) return;
  const res = await api('deleteUser',{username:uid});
  if (res.error) return showToast(res.error,'err');
  showToast('Carrier removed');
  const usersRes = await api('getUsers');
  setState({users:usersRes.users||{}});
}

async function saveLoads(uid) {
  const checks = document.querySelectorAll(`.load-check-${uid}`);
  const selected = Array.from(checks).filter(c=>c.checked).map(c=>c.value);
  const b64 = btoa(selected.join(','));
  const res = await api('assignLoads',{username:uid,loadsB64:b64});
  if (res.error) return showToast(res.error,'err');
  showToast('Loads saved');
  const usersRes = await api('getUsers');
  setState({users:usersRes.users||{}});
}

async function confirmDispatch(loadNum) {
  const username = state.session?.id || state.session?.name || '';
  const now = new Date().toLocaleString('en-US',{month:'short',day:'numeric',year:'numeric',hour:'numeric',minute:'2-digit',hour12:true});
  const btn = document.getElementById('confirm-block-'+loadNum);
  const res = await api('confirmLoad',{load_number:loadNum,confirmed_by:username,confirmed_at:now});
  if (res.error) return showToast(res.error,'err');
  state.trucks = state.trucks.map(t=>t.load_number===loadNum?{...t,confirmed_by:username,confirmed_at:now}:t);
  setState({});
  showToast('Dispatch confirmed');
}

async function saveActiveStops(loadNum) {
  const checks = document.querySelectorAll(`.stop-vis-${loadNum}`);
  const active = Array.from(checks).filter(c=>c.checked).map(c=>c.value);
  const stops  = active.join('|');
  const res = await api('saveActiveStops',{load_number:loadNum,stops});
  if (res.error) return showToast(res.error,'err');
  state.trucks = state.trucks.map(t=>t.load_number===loadNum?{...t,active_stops:active}:t);
  setState({});
  showToast('Visibility saved');
}

async function refreshLoads() {
  try {
    const res = await api('getLoads');
    setState({trucks:res.trucks||[]});
  } catch(e) { showToast('Error refreshing','err'); }
}

async function refreshAll() {
  try {
    const [loadsRes,usersRes] = await Promise.all([api('getLoads'),api('getUsers')]);
    setState({trucks:loadsRes.trucks||[],users:usersRes.users||{}});
  } catch(e) {}
}

function filterPickups(loadNum, query) {
  const dd = document.getElementById('pickup-dd-' + loadNum);
  if (!dd) return;
  const q = query.trim().toLowerCase();
  // Get current truck pickups to avoid duplication display
  const truck = state.trucks.find(t=>t.load_number===loadNum);
  const existing = (truck && truck.pickups)||[];
  const results = q
    ? state.addressBook.filter(loc=>loc.name.toLowerCase().includes(q) || loc.address.toLowerCase().includes(q))
    : state.addressBook;
  if (!results.length || !q) { dd.style.display='none'; return; }
    window.__pickupCandidates = window.__pickupCandidates || {};
  const candidateKey = 'pk_' + loadNum;
  window.__pickupCandidates[candidateKey] = results.slice(0,20);

  dd.innerHTML = window.__pickupCandidates[candidateKey].map((loc, i)=>`
    <div class="pickup-option" onclick="addPickupByIndex('${loadNum}',${i})">
      <div>${loc.name}</div>
      <div class="opt-addr">${loc.address}</div>
    </div>`).join('');
  dd.style.display='block';
}

function getDefaultPickups() {
  // Find Providence Warehouse in address book, fall back to name-only
  const pw = state.addressBook.find(loc=>loc.name.toUpperCase().includes('PROVIDENCE WAREHOUSE'));
  return pw
    ? [{name: pw.name, address: pw.address, datetime:'', notes:''}]
    : [{name:'PROVIDENCE WAREHOUSE', address:'2 Laurel Dr., Flanders NJ 07836', datetime:'', notes:''}];
}

function addPickupByIndex(loadNum, i) {
  const key = 'pk_' + loadNum;
  const loc = (window.__pickupCandidates && window.__pickupCandidates[key]) ?
              window.__pickupCandidates[key][i] : null;
  if (!loc) return;
  addPickup(loadNum, loc.name, loc.address);
}

function addPickup(loadNum, name, address) {
  const dd = document.getElementById('pickup-dd-' + loadNum);
  const inp = document.getElementById('pickup-input-' + loadNum);
  if (dd) dd.style.display='none';
  if (inp) inp.value='';
  state.trucks = state.trucks.map(t => {
    if (t.load_number !== loadNum) return t;
    const pickups = [...(t.pickups||[]), {name, address, datetime:'', notes:''}];
    return {...t, pickups};
  });
  render();
  setTimeout(()=>{ const i=document.getElementById('pickup-input-'+loadNum); if(i) i.focus(); },50);
}

function removePickup(loadNum, idx) {
  state.trucks = state.trucks.map(t => {
    if (t.load_number !== loadNum) return t;
    const pickups = (t.pickups||[]).filter((_,i)=>i!==idx);
    return {...t, pickups};
  });
  render();
}

function updatePickupField(loadNum, idx, field, value) {
  state.trucks = state.trucks.map(t => {
    if (t.load_number !== loadNum) return t;
    const pickups = (t.pickups||[]).map((p,i) => i===idx ? {...p, [field]: value} : p);
    return {...t, pickups};
  });
  // No render() — don't re-render while typing, just update state silently
  state = {...state};
}

async function savePickups(loadNum) {
  const truck = state.trucks.find(t=>t.load_number===loadNum);
  if (!truck) return;
  const pickups = truck.pickups || [];
  try {
    const json    = JSON.stringify(pickups);
    const b64     = btoa(unescape(encodeURIComponent(json)));
    const url = APPS_SCRIPT_URL + '?action=savePickups&load_number=' + encodeURIComponent(loadNum) + '&pickupsB64=' + encodeURIComponent(b64);
    const res  = await fetch(url, {method:'GET', redirect:'follow'});
    const data = await res.json();
    if (data.error) throw new Error(data.error);
    showToast('Pickups saved');
  } catch(e) {
    showToast(e.message||'Error saving pickups','err');
  }
}

async function searchArchive() {
  const input = document.getElementById('archive-input');
  const query = (input ? input.value : state.archiveQuery).trim();
  if (!query) return showToast('Enter a load number','err');

  // Show searching state immediately
  setState({archiveQuery: query, archiveResult: null, archiveError: null, archiveSearching: true});

  try {
    const res = await api('searchArchive', {load_number: query});

      setState({archiveError: res.error, archiveSearching: false});
    } else {
      setState({archiveResult: res.truck, archiveSearching: false});

// ── Boot ─────────────────────────────────────────────────
// ── GPS Tracking ─────────────────────────────────────────
let gpsWatchId = null;

function startGPS() {
  if (!navigator.geolocation) return;
  if (gpsWatchId) return; // already watching
  gpsWatchId = navigator.geolocation.watchPosition(
    pos => {
      if (!state.session || state.session.role === 'admin') return;
      const { latitude: lat, longitude: lng } = pos.coords;
      const timestamp = new Date().toLocaleString('en-US',{
        month:'short',day:'numeric',hour:'numeric',minute:'2-digit',hour12:true
      });
      // Save to sheet (fire and forget)
      api('saveLocation', {
        username:  state.session.id || state.session.name,
        lat:       lat.toFixed(6),
        lng:       lng.toFixed(6),
        timestamp
      }).catch(()=>{});
      // Update local state for map
      state.carrierLocation = { lat, lng, timestamp };
    },
    err => console.log('GPS error:', err.message),
    { enableHighAccuracy: true, maximumAge: 30000, timeout: 10000 }
  );
}

function stopGPS() {
  if (gpsWatchId) { navigator.geolocation.clearWatch(gpsWatchId); gpsWatchId = null; }
}

// ── Stop Done toggle ──────────────────────────────────────
function toggleStopDoneByIndex(loadNum, stopIndex, done) {
  // Find stop name by index to avoid apostrophe issues in onclick attributes
  const truck = state.trucks.find(t => t.load_number === loadNum);
  if (!truck) return;
  const allStops   = groupStops(truck.shipments);
  const activeNames = truck.active_stops && truck.active_stops.length > 0 ? truck.active_stops : null;
  const stops      = activeNames ? allStops.filter(s => activeNames.includes(s.name)) : allStops;
  const stop       = stops[stopIndex];
  if (!stop) return;
  toggleStopDone(loadNum, stop.name, done);
}

async function toggleStopDone(loadNum, stopName, done) {
  const username = state.session?.id || state.session?.name || '';
  const now = new Date().toLocaleString('en-US',{
    month:'short',day:'numeric',year:'numeric',
    hour:'numeric',minute:'2-digit',hour12:true
  });
  // Optimistic UI update
  state.trucks = state.trucks.map(t => {
    if (t.load_number !== loadNum) return t;
    const stop_status = {...(t.stop_status||{})};
    stop_status[stopName] = done ? {done:true, by:username, timestamp:now} : {done:false, by:'', timestamp:''};
    return {...t, stop_status};
  });
  setState({});
  try {
    await api('markStopDone', {
      username, load_number: loadNum, stop_name: stopName,
      done: done ? 'true' : 'false', timestamp: now
    });
  } catch(e) {
    showToast('Error saving stop status', 'err');
  }
}

// ── Manager view ──────────────────────────────────────────
async function setManagerStatus(uid, isManager) {
  try {
    const u = state.users[uid];
    await api('setManager', {
      username: uid,
      is_manager: isManager ? 'true' : 'false',
      manages: (u.manages||[]).join('|')
    });
    const res = await api('getUsers');
    setState({users: res.users||{}});
    showToast(isManager ? `${uid} is now a manager` : `${uid} is no longer a manager`);
  } catch(e) { showToast(e.message||'Error','err'); }
}

function updateManagesByIndex(uid, idx, add) {
  // Index-based to avoid quote issues with usernames containing special chars
  const allOtherUsers = Object.keys(state.users).filter(k => k !== uid);
  const teammateUid   = allOtherUsers[idx];
  if (!teammateUid) return;
  updateManages(uid, teammateUid, add);
}

async function updateManages(uid, teammateUid, add) {
  const u = state.users[uid];
  let manages = [...(u.manages||[])];
  if (add && !manages.includes(teammateUid)) manages.push(teammateUid);
  if (!add) manages = manages.filter(m => m !== teammateUid);
  try {
    await api('setManager', {
      username: uid,
      is_manager: 'true',
      manages: manages.join('|')
    });
    const res = await api('getUsers');
    setState({users: res.users||{}});
    showToast('Team updated');
  } catch(e) { showToast(e.message||'Error','err'); }
}

// ── GPS Map modal ─────────────────────────────────────────
async function showGPSMap() {
  setState({showGPSMap: true, gpsLocations: [], gpsLoading: true});
  try {
    const res = await api('getLocations');
    setState({gpsLocations: res.locations||[], gpsLoading: false});
  } catch(e) {
    setState({gpsLoading: false});
    showToast('Error loading locations','err');
  }
}

// Keep Apps Script container warm — ping every 4 minutes
// This prevents the 3-5s cold start delay on the next real request
(function keepAlive() {
  setInterval(async () => {
    try { await fetch(APPS_SCRIPT_URL + '?action=ping', {method:'GET', redirect:'follow'}); } catch(e) {}
  }, 4 * 60 * 1000); // every 4 minutes
})();

(async function boot() {
  // Restore session from sessionStorage (survives refresh/back)
  try {
    const saved = sessionStorage.getItem('pfs_session');
    if (saved) {
      const session = JSON.parse(saved);
      state.session = session;
      state.view = session.role === 'admin' ? 'admin' : 'driver';
      if (session.role !== 'admin') setTimeout(startGPS, 1000);
    } else {
      state.view = 'login'; // show login immediately — don't wait for data
    }
  } catch(e) {
    state.view = 'login';
  }

  render(); // paint login or restored view right away — no spinner wait

  // Load all data silently in the background
  try {
    // Boot with only essential data — address book loads lazily when needed
    const [loadsRes, usersRes] = await Promise.all([
      api('getLoads'),
      api('getUsers')
    ]);
    const patch = {
      trucks: loadsRes.trucks || [],
      users:  usersRes.users  || {}
    };
    // If session was restored, stay on current view; otherwise go to login
    if (!state.session) patch.view = 'login';
    setState(patch);
  } catch(e) {
    // Data failed — user can still see login and retry via Refresh after logging in
    if (!state.session) setState({view:'login'});
  }
})();
